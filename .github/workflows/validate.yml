name: Validate seed data

# Проверка на каждый push и PR в ветки данных: sm читает Write API SecurityMaster, ordo — Ordo
on:
  push:
    branches: [main, sm, ordo]
  pull_request:
    branches: [main, sm, ordo]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run validate
